[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ndsm-creator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "azure-identity>=1.15",
    "azure-storage-blob>=12.19",
    "numpy>=1.26",
    "rasterio>=1.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
ndsm-creator = "ndsm_creator.main:main"

[tool.setuptools.packages.find]
where = ["system"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["system"]
